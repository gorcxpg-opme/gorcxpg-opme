<radialGradient id="gBrilho" cx="0.82" cy="0.35" r="0.6"><stop offset="0" stop-color="#2f4fd0" stop-opacity="0.10"/><stop offset="1" stop-color="#2f4fd0" stop-opacity="0"/></radialGradient>
<clipPath id="cartao"><rect width="1200" height="452" rx="20"/></clipPath>

